<style>
/* Layout: sticky-less single column, floating glass tab bar with raised add button, gradient hero with soft blobs, collapsible category groups, bottom sheets. Lapis-to-teal brand gradient. */
:root{
  --bg:#EDF0F8; --surface:#FFFFFF; --surface2:#E7ECF7; --ink:#0F1730; --muted:#5A6687; --line:#DCE2F0;
  --accent:#1B3FC4; --accent-ink:#FFFFFF; --in:#0A8F7F; --out:#C22E4B; --gold:#A97F10;
  --hero-a:#1B3FC4; --hero-b:#0D8A8F; --hero-ink:#FFFFFF; --glass:rgba(255,255,255,.8);
  --ok-bg:#D8F3EB; --ok-fg:#06695C; --warn-bg:#FFEFC9; --warn-fg:#7A4B00; --bad-bg:#FFDCE3; --bad-fg:#9B1C36;
  --shadow:0 1px 2px rgba(16,24,48,.05),0 10px 30px rgba(16,24,48,.07);
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif; --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080D1B; --surface:#111830; --surface2:#1A2342; --ink:#EAEEFA; --muted:#9CA7C8; --line:#25304F;
  --accent:#7B93FF; --accent-ink:#080D1B; --in:#3FD1BC; --out:#FF7C95; --gold:#E3BC4E;
  --hero-a:#5C78F5; --hero-b:#2FC4B0; --hero-ink:#06101F; --glass:rgba(17,24,48,.78);
  --ok-bg:#123D36; --ok-fg:#5FE0CB; --warn-bg:#3F3213; --warn-fg:#F2C46A; --bad-bg:#45182A; --bad-fg:#FF9DB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080D1B; --surface:#111830; --surface2:#1A2342; --ink:#EAEEFA; --muted:#9CA7C8; --line:#25304F;
  --accent:#7B93FF; --accent-ink:#080D1B; --in:#3FD1BC; --out:#FF7C95; --gold:#E3BC4E;
  --hero-a:#5C78F5; --hero-b:#2FC4B0; --hero-ink:#06101F; --glass:rgba(17,24,48,.78);
  --ok-bg:#123D36; --ok-fg:#5FE0CB; --warn-bg:#3F3213; --warn-fg:#F2C46A; --bad-bg:#45182A; --bad-fg:#FF9DB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 40% at 100% 0%,color-mix(in srgb,var(--hero-a) 16%,transparent),transparent 70%),radial-gradient(60% 35% at 0% 8%,color-mix(in srgb,var(--hero-b) 13%,transparent),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,background-color .15s,opacity .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{min-height:100vh;padding-block:0 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:filter .2s}
#app.shield{filter:blur(18px)}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:16px}
.col.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.col.enter>*:nth-child(2){animation-delay:.04s}.col.enter>*:nth-child(3){animation-delay:.08s}.col.enter>*:nth-child(4){animation-delay:.12s}.col.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.muted,small{color:var(--muted)}
.hide-amt .amt{filter:blur(7px);user-select:none}
h3{margin:0 0 12px;font-size:16px;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{white-space:nowrap;font-family:var(--font-display);font-size:30px;line-height:1.05;background:linear-gradient(90deg,var(--hero-a),var(--hero-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.top small{font-size:12.5px}
.tools{display:flex;gap:8px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px;align-self:center;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:4px}
.monthnav .lbl{min-width:118px;text-align:center;font-weight:800}
.ibtn{border:1px solid var(--line);background:var(--glass);border-radius:14px;width:40px;height:40px;display:grid;place-items:center;backdrop-filter:blur(10px)}
.monthnav .ibtn{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 40px -12px color-mix(in srgb,var(--hero-a) 60%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.13;pointer-events:none}
.hero::before{width:190px;height:190px;left:-60px;top:-70px}.hero::after{width:130px;height:130px;right:-40px;bottom:-50px}
.hero>*{position:relative}
.hero small{color:inherit;opacity:.88}
.hero .big{font-family:var(--font-display);font-size:52px;line-height:1.1}
.hero .stats{display:flex;gap:10px;margin-top:6px}
.hero .stats div{flex:1;background:rgba(255,255,255,.17);border-radius:16px;padding:8px 12px}
.hero .stats b{display:block;font-size:17px}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hero .btn{background:rgba(255,255,255,.24);color:inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .stats div,:root:not([data-theme="light"]) .hero .btn{background:rgba(6,16,31,.2)}}
:root[data-theme="dark"] .hero .stats div,:root[data-theme="dark"] .hero .btn{background:rgba(6,16,31,.2)}
.hero.neg{background:linear-gradient(135deg,#B3203F,#E0644F);color:#fff}
.btn{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--out);color:#fff}
.btn.sm{padding:5px 13px;font-size:13px;border-radius:11px}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:10px 13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{min-height:100px;direction:ltr;font-family:monospace;font-size:12px}
.grp{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:12px 2px 8px;font-weight:800;font-size:14.5px;text-align:right;gap:8px}
.grp .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;transition:transform .2s;flex:none}
.grp.closed .chev{transform:rotate(90deg)}
.grp .gs{flex:1;text-align:left;font-weight:400;font-size:12.5px;color:var(--muted)}
.crow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"b n p" ". a a";gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.badge{grid-area:b;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.cname{grid-area:n;background:none;border:0;text-align:right;padding:0;font-weight:600;min-width:0;line-height:1.5}
.cname small{display:block;font-size:12px;font-weight:400}
.pill{grid-area:p;min-width:84px;text-align:center;border-radius:99px;padding:3px 10px;font-weight:800;font-size:13.5px;background:var(--surface2)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.arow{grid-area:a;display:flex;align-items:center;gap:10px}
.mini{flex:1;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.mini>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px}
.mini.over>i{background:var(--out)}
input.asg{width:112px;padding:5px 10px;text-align:left;direction:ltr;border-radius:11px;font-variant-numeric:tabular-nums;font-size:14px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.lbl-row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;align-items:center}
.catb{display:grid;gap:5px;padding:7px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px 15px;box-shadow:var(--shadow)}
.tile b{font-size:21px;display:block}
.seg{display:flex;background:var(--surface2);border-radius:16px;padding:4px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:7px 8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:12px 4px 4px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 4px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:right}
.tx .mid{flex:1;min-width:0}
.tx .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-c{color:var(--in)}.out-c{color:var(--out)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
.field>label{font-size:13px;color:var(--muted)}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));z-index:20;pointer-events:none}
.nav .bar2{pointer-events:auto;max-width:480px;margin:0 auto;display:flex;align-items:center;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);border-radius:32px;padding:6px;box-shadow:var(--shadow)}
.nav .bar2 button{flex:1;border:0;background:none;padding:6px 2px;border-radius:22px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.nav .bar2 button.on{color:var(--accent);font-weight:800;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav .bar2 .plus{flex:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);margin:0 4px;transform:translateY(-16px);box-shadow:0 12px 24px -4px color-mix(in srgb,var(--hero-a) 65%,transparent);display:grid;place-items:center;padding:0}
.nav .bar2 .plus:active{transform:translateY(-16px) scale(.94)}
.nav .plus svg{width:26px;height:26px;stroke-width:2.5}
.ovl{position:fixed;inset:0;background:rgba(5,8,20,.55);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:18px}
.acts{display:flex;gap:8px;margin-top:8px}.acts .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:70;font-size:14px;max-width:90%;animation:rise .25s both}
.upd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 8px 6px 16px;display:flex;gap:10px;align-items:center;font-size:13.5px;box-shadow:var(--shadow)}
.banner{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border-radius:99px;padding:3px 13px;font-size:13px;border:0}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.score{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:88px;height:88px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--in)) calc(var(--p)*1%),var(--surface2) 0)}
.ring>span{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-size:26px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px}
.chk li::before{content:"✓";display:inline-block;width:20px;color:var(--in);font-weight:800}
.chk li.no{color:var(--muted)}.chk li.no::before{content:"✗";color:var(--out)}
.meter{display:flex;gap:4px}.meter i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}.meter i.on{background:var(--in)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:6px}
.lock{position:fixed;inset:0;z-index:100;background:#070C22;color:#fff;display:grid;place-items:center;padding:20px;overflow:hidden}
.lock::before,.lock::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.lock::before{width:340px;height:340px;background:#1B3FC4;top:-120px;right:-100px}.lock::after{width:300px;height:300px;background:#0D8A8F;bottom:-110px;left:-90px}
.lock .box{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:stretch}
.lock .logo{width:84px;height:84px;margin:0 auto;border-radius:24px;box-shadow:0 14px 40px rgba(27,63,196,.5)}
.lock h1{font-family:var(--font-display);font-size:38px;margin:0;font-weight:400}
.lock input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;text-align:center;font-size:18px;padding:13px;border-radius:16px}
.lock .btn{background:#fff;color:#0B1437;padding:13px;border-radius:16px}
.lock .fp{align-self:center;width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;padding:0}
.lock .fp svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round}
.lock small{color:rgba(255,255,255,.78)}
.err{color:#FFB3C0;min-height:24px}
svg text{fill:var(--muted);font-family:var(--font-body);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}

/* ===== v3 polish ===== */
:root{--r:24px;--ease:cubic-bezier(.22,.9,.28,1);--spring:cubic-bezier(.34,1.45,.5,1)}
html{-webkit-text-size-adjust:100%}
body{font-feature-settings:"ss01";text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
body::before{background:radial-gradient(60% 34% at 100% 0%,color-mix(in srgb,var(--hero-a) 20%,transparent),transparent 70%),radial-gradient(55% 30% at 0% 10%,color-mix(in srgb,var(--hero-b) 16%,transparent),transparent 70%),radial-gradient(70% 30% at 50% 100%,color-mix(in srgb,var(--hero-a) 9%,transparent),transparent 70%)}
.card,.tile{border-radius:var(--r);border-color:color-mix(in srgb,var(--line) 70%,transparent);transition:transform .25s var(--ease),box-shadow .25s}
.card h3{letter-spacing:-.1px}
.hero{border-radius:30px;padding:22px 20px;background:linear-gradient(135deg,var(--hero-a) 0%,color-mix(in srgb,var(--hero-a) 45%,var(--hero-b)) 55%,var(--hero-b) 100%);box-shadow:0 22px 44px -16px color-mix(in srgb,var(--hero-a) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.hero::before{opacity:.16;animation:float 9s ease-in-out infinite alternate}
.hero::after{opacity:.12;animation:float 12s ease-in-out infinite alternate-reverse}
@keyframes float{to{transform:translate(18px,14px) scale(1.12)}}
.hero .big{font-size:56px;letter-spacing:-1px;text-shadow:0 2px 18px rgba(0,0,0,.14)}
.hero .stats div{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2)}
.hero .stats b{font-size:18px}
.btn{transition:transform .15s var(--ease),box-shadow .2s,filter .15s;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn.ghost,.hero .btn,.lock .btn{box-shadow:none}
.btn:active{transform:scale(.95);filter:brightness(.95)}
.ibtn{transition:transform .15s var(--ease),background-color .2s}
.ibtn:active{transform:scale(.88)}
.monthnav{box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.monthnav .lbl{transition:opacity .2s}
.crow{transition:background-color .2s;border-radius:14px;margin:0 -6px;padding-inline:6px}
.crow:active,.tx:active{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tx{border-radius:14px;transition:background-color .2s}
.badge{border-radius:14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.pill{transition:background-color .3s,color .3s,transform .25s var(--spring)}
.pill.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.14)}}
.mini,.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.mini>i,.bar>i{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);background-size:220% 100%;background-color:var(--c,var(--accent))}
@media (prefers-reduced-motion:no-preference){.mini>i,.bar>i{animation:grow .7s var(--ease) both,sheen 3.2s 1s ease-in-out infinite}}
@keyframes grow{from{transform:scaleX(0);transform-origin:right}}
@keyframes sheen{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}
.seg{box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.seg button{transition:background-color .25s,color .25s,box-shadow .25s,transform .15s}
.chip{transition:background-color .2s,color .2s,transform .15s}.chip:active{transform:scale(.94)}
input[type=text],input[type=password],input[type=number],select,textarea{transition:border-color .2s,background-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.nav .bar2{border-radius:34px;box-shadow:0 18px 40px -12px rgba(8,14,40,.35),inset 0 1px 0 rgba(255,255,255,.18);background:color-mix(in srgb,var(--surface) 72%,transparent)}

.col.enter>*{animation:rise .5s var(--ease) both}

@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}

.upd{animation:rise .5s var(--spring) both}

.lock .box{animation:rise .6s var(--ease) both}

.lock .fp::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,255,255,.28);animation:ping 2.2s ease-out infinite}

@media (hover:hover){.card:hover{transform:translateY(-2px)}}

/* ===== budget engine ===== */
function compute(sel){
  var min=sel,act={},inc={},incBefore=0,asgBefore=0;
  S.tx.forEach(function(t){min=Math.min(min,t.mk)});Object.keys(S.assigned).forEach(function(k){min=Math.min(min,+k)});
  min=Math.max(min,sel-72);
  S.tx.forEach(function(t){var b=base(t);if(t.cat==='rta'){inc[t.mk]=(inc[t.mk]||0)+b}else if(t.cat&&!t.tf){(act[t.mk]=act[t.mk]||{})[t.cat]=((act[t.mk]||{})[t.cat]||0)+b}});
  Object.keys(inc).forEach(function(k){if(+k<min)incBefore+=inc[k]});
  Object.keys(S.assigned).forEach(function(k){if(+k<min)Object.keys(S.assigned[k]).forEach(function(c){asgBefore+=S.assigned[k][c]})});
  var cats=allCats(),carry={},res={},incCum=incBefore,asgCum=asgBefore,lost=0;
  for(var m=min;m<=sel;m++){incCum+=inc[m]||0;
    cats.forEach(function(c){var asg=(S.assigned[m]||{})[c.id]||0,ac=(act[m]||{})[c.id]||0,cin=carry[c.id]||0,a=cin+asg+ac;asgCum+=asg;
      if(m<sel){if(a<0){lost+=-a;carry[c.id]=0}else carry[c.id]=a}else res[c.id]={assigned:asg,activity:ac,available:a,carryIn:cin}})}
  var under={};cats.forEach(function(c){var t=c.target,r=res[c.id],need=0;
    if(t&&t.amt>0){if(t.type==='monthly')need=Math.max(0,t.amt-r.assigned);else{var left=Math.max(1,t.mk-sel+1);need=Math.max(0,Math.ceil((t.amt-r.carryIn)/left)-r.assigned);if(r.carryIn>=t.amt)need=0}}
    r.need=need});
  return{rta:incCum-asgCum-lost,cats:res,inc:inc,act:act}}
function balances(){var b={};S.accounts.forEach(function(a){b[a.id]=0});S.tx.forEach(function(t){if(b[t.acc]!=null)b[t.acc]+=t.amt});return b}
function ageOfMoney(){
  var ins=S.tx.filter(function(t){return t.cat==='rta'&&base(t)>0}).sort(function(a,b){return a.d<b.d?-1:1}).map(function(t){return{d:dayNo(t.d),a:base(t)}});
  var outs=S.tx.filter(function(t){return t.cat&&t.cat!=='rta'&&!t.tf&&base(t)<0}).sort(function(a,b){return a.d<b.d?-1:1}),ages=[],qi=0;
  outs.forEach(function(t){var need=-base(t),dn=dayNo(t.d),wsum=0,w=0;
    while(need>0.001&&qi<ins.length){var take=Math.min(need,ins[qi].a);wsum+=take*(dn-ins[qi].d);w+=take;ins[qi].a-=take;need-=take;if(ins[qi].a<=0.001)qi++}
    if(w>0)ages.push(wsum/w)});
  var last=ages.slice(-10);return last.length?Math.round(last.reduce(function(a,b){return a+b},0)/last.length):null}

/* ===== quick parse ===== */
function parseQuick(text){
  var s=norm(text).toLowerCase(),o={amt:0,date:todayIso(),cat:null,note:'',cur:null},m;
  if(!s.trim())return null;
  var cm=[['USD',/(\$|usd|دالر|دلار)/],['EUR',/(€|eur|یورو)/],['PKR',/(pkr|کلدار|روپیه)/],['IRT',/(تومان|تومن)/],['AFN',/(afn|افغانی|افغ|؋)/]];
  for(var i=0;i<cm.length;i++){if(cm[i][1].test(s)){o.cur=cm[i][0];s=s.replace(cm[i][1],' ');break}}
  if(/پریروز/.test(s)){o.date=addDays(o.date,-2);s=s.replace('پریروز',' ')}else if(/دیروز/.test(s)){o.date=addDays(o.date,-1);s=s.replace('دیروز',' ')}else if((m=s.match(/(\d+)\s*روز\s*پیش/))){o.date=addDays(o.date,-(+m[1]));s=s.replace(m[0],' ')}
  s=s.replace('امروز',' ');
  var mult={'k':1e3,'هزار':1e3,'میلیون':1e6,'ملیون':1e6};
  m=s.match(/(\d+(?:\.\d+)?)\s*(k\b|هزار|میلیون|ملیون)?/);if(m){o.amt=parseFloat(m[1])*(m[2]?mult[m[2]]:1);s=s.replace(m[0],' ')}else if(/هزار/.test(s)){o.amt=1000;s=s.replace('هزار',' ')}
  o.note=s.replace(/\s+/g,' ').trim();
  var cs=allCats();for(var j=0;j<cs.length;j++){if(cs[j].kw&&new RegExp(cs[j].kw).test(norm(text))){o.cat=cs[j].id;break}}
  if(!o.cat)for(var k=0;k<cs.length;k++){if(norm(text).indexOf(cs[k].name)>=0){o.cat=cs[k].id;break}}
  return o}
